name: Nohuska SEO Bot

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar la web
        uses: actions/checkout@v4

      - name: Ejecutar auditoría SEO
        id: audit
        continue-on-error: true
        run: python scripts/seo_audit.py

      - name: Mostrar informe
        if: always()
        run: cat seo-report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar informe descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-seo-nohuska
          path: seo-report/
          retention-days: 90

      - name: Crear aviso si hay errores
        if: steps.audit.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('seo-report/report.md', 'utf8').slice(0, 60000);
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Aviso SEO semanal — ${date}`,
              body: `${report}\n\nRevisar el detalle descargable en la ejecución de GitHub Actions.`,
              labels: ['seo']
            });

      - name: Bloquear errores críticos
        if: steps.audit.outcome == 'failure'
        run: exit 1
